<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Spambuntu{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% if user %}
  <header class="topbar">
    <span class="brand">Spambuntu</span>
    <nav>
      <a href="{{ url_for('index') }}" {% if active == 'index' %}class="active"{% endif %}>Tableau de bord</a>
      <a href="{{ url_for('quarantine_page') }}" {% if active == 'quarantine' %}class="active"{% endif %}>Quarantaine</a>
      <a href="{{ url_for('mail_page') }}" {% if active == 'mail' %}class="active"{% endif %}>Messagerie</a>
      <a href="{{ url_for('update_page') }}" {% if active == 'update' %}class="active"{% endif %}>Mises à jour</a>
    </nav>
    <span class="spacer"></span>
    <span class="version">v{{ version }}</span>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="linklike">Déconnexion</button>
    </form>
  </header>
{% endif %}
  <main>
    {% if flash %}<div class="banner {{ flash.kind }}" role="status">{{ flash.text }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
