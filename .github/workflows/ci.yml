name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances de test
        run: pip install flask pytest pyyaml
      - name: shellcheck
        run: shellcheck -S warning appliance/install.sh appliance/hooks/*.sh tools/*.sh
      - name: Tests
        run: python -m pytest -q
